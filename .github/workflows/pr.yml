name: Pull Request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Install toolchain
        uses: jdx/mise-action@v5
        with:
          cache: true
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - name: Cache Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('mise.toml', '.infrastructure/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Test deployment protocol offline
        run: |
          python -m unittest discover -s scripts/deployment -p 'test_*.py'
          python -O -m unittest discover -s scripts/deployment -p 'test_*.py'
      - name: Build with Maven
        run: python scripts/deployment/reproducible_build.py --commit "$GITHUB_SHA"
      - name: Install and test infrastructure
        working-directory: .infrastructure
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test
          mkdir -p ../.private/cdk-source
          pnpm exec cdk synth bible-verse-stack --app 'pnpm exec ts-node bin/bibleverse-source-only.ts' --no-lookups --output ../.private/cdk-source --quiet > ../.private/source-synth.log 2>&1 || { echo 'Source synthesis failed; no private template or log uploaded.'; exit 1; }

