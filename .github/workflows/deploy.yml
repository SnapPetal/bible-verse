name: Deploy
# Legacy push deployment intentionally retired. Real Java releases use the reviewed
# manual java-release workflow; unsupported infrastructure changes stop there.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bible-isolated-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python -m unittest discover -s scripts/deployment -p 'test_*.py'
