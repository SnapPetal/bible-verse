name: Bible build and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      application_commit:
        description: 'Optional exact ancestor application commit for an already-completed phase-one retry'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: bible-isolated-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.repository == 'SnapPetal/bible-verse'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select application source without changing deployment code
        id: application
        run: python scripts/deployment/select_application.py --prepare
      - uses: jdx/mise-action@v5
        with:
          cache: true
      - name: Test deployment checks offline
        run: |
          python -m unittest discover -s scripts/deployment -p 'test_*.py'
          python -O -m unittest discover -s scripts/deployment -p 'test_*.py'
      - name: Build and synthesize only the Bible application
        shell: bash
        working-directory: ${{ steps.application.outputs.root }}
        env:
          APPLICATION_COMMIT: ${{ steps.application.outputs.commit }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .private/cdk-source
          # Public source only, before AWS authentication: keep useful build/test diagnostics.
          python scripts/deployment/reproducible_build.py --commit "$APPLICATION_COMMIT"
          (cd .infrastructure && pnpm install --frozen-lockfile && pnpm build && pnpm test)
          # Do not print a synthesized template; public-source synthesis errors remain visible.
          (cd .infrastructure && pnpm exec cdk synth bible-verse-stack --app 'pnpm exec ts-node bin/bibleverse-source-only.ts' --no-lookups --output ../.private/cdk-source --quiet) > .private/source-synth.stdout
      - name: Authenticate Bible entry role for planning
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::664759038511:role/GitHubActionsBibleVerseProdDeploy
          aws-region: us-east-1
          role-session-name: bible-entry-${{ github.run_id }}
          allowed-account-ids: '664759038511'
          unset-current-credentials: true
          role-chaining: false
      - name: Assume scoped deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::664759038511:role/BibleVerseCdkDeploy
          role-chaining: true
          role-skip-session-tagging: true
          aws-region: us-east-1
          role-session-name: bible-java-${{ github.run_id }}
          allowed-account-ids: '664759038511'
      - name: Check live baseline and application-only source changes
        run: python scripts/deployment/simple_deploy.py plan --template "${{ steps.application.outputs.root }}/.private/cdk-source/bible-verse-stack.template.json" --jar "${{ steps.application.outputs.root }}/target/bibleverse-2.0.0-aws.jar"
      - name: Authenticate fresh Bible entry role for publication
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::664759038511:role/GitHubActionsBibleVerseProdDeploy
          aws-region: us-east-1
          role-session-name: bible-entry-${{ github.run_id }}
          allowed-account-ids: '664759038511'
          unset-current-credentials: true
          role-chaining: false
      - name: Assume scoped publisher role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::664759038511:role/BibleVerseCdkFilePublisher
          role-chaining: true
          role-skip-session-tagging: true
          aws-region: us-east-1
          role-session-name: bible-publish-${{ github.run_id }}
          allowed-account-ids: '664759038511'
      - name: Publish immutable application JAR
        run: python scripts/deployment/simple_deploy.py publish --template "${{ steps.application.outputs.root }}/.private/cdk-source/bible-verse-stack.template.json" --jar "${{ steps.application.outputs.root }}/target/bibleverse-2.0.0-aws.jar"
      - name: Authenticate fresh Bible entry role for deployment
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::664759038511:role/GitHubActionsBibleVerseProdDeploy
          aws-region: us-east-1
          role-session-name: bible-entry-${{ github.run_id }}
          allowed-account-ids: '664759038511'
          unset-current-credentials: true
          role-chaining: false
      - name: Assume scoped deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::664759038511:role/BibleVerseCdkDeploy
          role-chaining: true
          role-skip-session-tagging: true
          aws-region: us-east-1
          role-session-name: bible-java-${{ github.run_id }}
          allowed-account-ids: '664759038511'
      - name: Deploy app versions, verify readiness, then move live aliases
        run: python scripts/deployment/simple_deploy.py deploy --template "${{ steps.application.outputs.root }}/.private/cdk-source/bible-verse-stack.template.json" --jar "${{ steps.application.outputs.root }}/target/bibleverse-2.0.0-aws.jar"

